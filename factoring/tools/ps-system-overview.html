<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přehled spojení Ps/Px systémů</title>
    <link rel="stylesheet" href="ps-system-overview.css">
    <script type="module" src="ps-system-overview.js"></script>
</head>
<body>
    <main>
        <h1>Přehled spojení Ps/Px systémů</h1>
        <p class="description">
            Vyberte výchozí Ps/Px systém nebo samostatnou stanici.
            Ostatní systémy budou seřazeny podle zvolených pravidel.
        </p>

        <section class="selection-panel">
            <label for="_sourcevalue">Výchozí bod</label>
            <select id="_sourcetype">
                <option value="system">Ps/Px systém</option>
                <option value="station">Stanice</option>
            </select>
            <input id="_sourcevalue" list="_sourceoptions" autocomplete="off"
                placeholder="Začněte psát název systému">
            <datalist id="_sourceoptions"></datalist>
            <button id="_createoverview" type="button">VYTVOŘIT PŘEHLED</button>
        </section>

        <section class="filter-panel">
            <div class="filter-field">
                <label for="_minconnections">Vlaků/den – nejméně</label>
                <input id="_minconnections" type="number" min="0" step="1" placeholder="Bez minima">
            </div>
            <div class="filter-field">
                <label for="_maxconnections">Vlaků/den – nejvýše</label>
                <input id="_maxconnections" type="number" min="0" step="1" placeholder="Bez maxima">
            </div>
            <div class="filter-field">
                <label for="_mindistance">Vzdálenost – nejméně (km)</label>
                <input id="_mindistance" type="number" min="0" step="0.1" placeholder="Bez minima">
            </div>
            <div class="filter-field">
                <label for="_maxdistance">Vzdálenost – nejvýše (km)</label>
                <input id="_maxdistance" type="number" min="0" step="0.1" placeholder="Bez maxima">
            </div>
            <div class="filter-field">
                <label for="_minimportance">Důležitost – nejméně</label>
                <input id="_minimportance" type="number" min="0" step="0.01" placeholder="Bez minima">
            </div>
            <div class="filter-field">
                <label for="_maximportance">Důležitost – nejvýše</label>
                <input id="_maximportance" type="number" min="0" step="0.01" placeholder="Bez maxima">
            </div>
            <div class="filter-field">
                <label for="_sortby">Seřadit podle</label>
                <select id="_sortby">
                    <option value="distance">Vzdálenosti</option>
                    <option value="connections">Počtu vlaků</option>
                    <option value="fastestTime">Nejrychlejší doby jízdy</option>
                    <option value="averageTime">Průměrné doby jízdy</option>
                    <option value="importance">Důležitosti</option>
                    <option value="importancePerDistance">Důležitosti / vzdálenosti</option>
                </select>
            </div>
            <div class="filter-field">
                <label for="_sortdirection">Směr řazení</label>
                <select id="_sortdirection">
                    <option value="ascending">Od nejnižšího</option>
                    <option value="descending">Od nejvyššího</option>
                </select>
            </div>
            <fieldset class="train-type-filter">
                <legend>Započítané typy vlaků</legend>
                <div id="_traintypeoptions" class="train-type-options"></div>
            </fieldset>
        </section>

        <div id="_overviewstatus" role="status"></div>
        <section id="_overviewresults" aria-live="polite"></section>
    </main>
</body>
</html>
